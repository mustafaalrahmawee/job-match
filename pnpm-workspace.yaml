packages:
  - backend
  - frontend
  - shared

# pnpm führt Postinstall-Skripte nur für Pakete aus, die hier freigegeben sind (seit pnpm 10 in
# dieser Datei, nicht mehr in der package.json).
allowBuilds:
  # esbuild (genutzt von tsx, vite, vitest und drizzle-kit) prüft beim Installieren sein Binary.
  esbuild: true
  # vue-demi (Abhängigkeit von Pinia) wählt per Skript die Vue-Version.
  vue-demi: true

minimumReleaseAgeExclude:
  - pino@10.4.0
  - supertest@7.3.1
