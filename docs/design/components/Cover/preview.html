<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet"><style>
body{margin:0;width:960px;height:288px;position:relative;background:var(--background);font-family:var(--font-sans);overflow:hidden}
svg{position:absolute;inset:0}
.brand{fill:var(--brand)}.ink{fill:var(--primary)}.ok{fill:var(--success)}.warn{fill:var(--warning)}.tint{fill:var(--accent)}.hole{fill:var(--background)}
.tile{rx:10px}.pill{rx:18px}
.name{position:absolute;left:48px;bottom:60px;margin:0;font-size:72px;line-height:.92;font-weight:600;letter-spacing:-.03em;color:var(--foreground)}
.tag{position:absolute;left:48px;bottom:36px;margin:0;font-size:13px;line-height:16px;color:var(--muted-foreground)}
</style></head><body>
<!--
blocks: brand 232x120, primary 112x120, success 112x56, accent 232x56, warning 56x56; sides are space-4 multiples (56=space-4+... from the 8px step), corners radius-lg
arrangement: a flush modular grid right of x=480, two rows, one tile merged two-wide like the CV page's wide tips card, bleeding off the right edge
pattern: geometric, modular, dense UI (cards and pills in one sidebar layout) -> tiles cut by the radius tokens, some merged two-wide; a row of small pills in radius-full from the status pills
scales: pitch 8px (space-2) gaps, tile radius radius-lg, pill radius 18px = half of 36px (control)
-->
<svg viewBox="0 0 960 288" width="960" height="288">
  <rect class="brand tile" x="480" y="24" width="232" height="120"/>
  <rect class="ink tile" x="720" y="24" width="112" height="120"/>
  <rect class="tint tile" x="840" y="24" width="144" height="56"/>
  <rect class="ok tile" x="840" y="88" width="144" height="56"/>
  <rect class="tint tile" x="480" y="152" width="232" height="56"/>
  <rect class="warn tile" x="720" y="152" width="56" height="56"/>
  <rect class="ink tile" x="784" y="152" width="200" height="56"/>
  <rect class="brand pill" x="480" y="216" width="112" height="36"/>
  <rect class="tint pill" x="600" y="216" width="80" height="36"/>
  <rect class="ok pill" x="688" y="216" width="136" height="36"/>
  <rect class="tint pill" x="832" y="216" width="152" height="36"/>
  <rect class="hole" x="504" y="48" width="8" height="8" rx="4"/>
  <rect class="hole" x="504" y="64" width="72" height="4" rx="2"/>
  <rect class="hole" x="504" y="76" width="48" height="4" rx="2"/>
</svg>
<p class="name">job-match</p>
<p class="tag">Von der Stellenanzeige bis zur Zusage.</p>
</body></html>
