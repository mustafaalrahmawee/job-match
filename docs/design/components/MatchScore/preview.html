<!-- @dsCard group="Flächen" height=200 subtitle="Vorgesehen für Stufe 3" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:20px}*{box-sizing:border-box}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:36px;padding:0 16px;border-radius:var(--radius-md);font:inherit;font-weight:500;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}.btn-outline{background:var(--background);color:var(--foreground);border-color:var(--border)}.btn-ghost{background:transparent;color:var(--muted-foreground);padding:0 10px;height:32px}.btn-destructive{background:var(--destructive);color:var(--destructive-foreground)}.btn:disabled{opacity:.5}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:16px}
.input{height:36px;width:100%;border:1px solid var(--input);background:var(--background);color:var(--foreground);border-radius:var(--radius-md);padding:0 12px;font:inherit;box-shadow:var(--shadow-xs);outline:none}.input:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 50%,transparent)}
.pill{display:inline-flex;align-items:center;border-radius:var(--radius-full);padding:2px 8px;font-size:12px;line-height:16px;font-weight:500}
.muted{color:var(--muted-foreground)}.small{font-size:12px;line-height:16px}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:720px">
<section class="card" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:600">Match</span><span style="font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.025em">82</span></div><div style="height:6px;border-radius:var(--radius-full);background:var(--secondary)"><div style="height:6px;width:82%;border-radius:var(--radius-full);background:var(--success)"></div></div><p class="muted small" style="margin:0">Sehr gute Passung</p></section>
<section class="card" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:600">Match</span><span style="font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.025em">68</span></div><div style="height:6px;border-radius:var(--radius-full);background:var(--secondary)"><div style="height:6px;width:68%;border-radius:var(--radius-full);background:var(--warning)"></div></div><p class="muted small" style="margin:0">Gute Passung, 1 Lücke: Kubernetes</p></section>
<section class="card" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:600">Match</span><span style="font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.025em">31</span></div><div style="height:6px;border-radius:var(--radius-full);background:var(--secondary)"><div style="height:6px;width:31%;border-radius:var(--radius-full);background:var(--destructive)"></div></div><p class="muted small" style="margin:0">Geringe Passung</p></section>
</div></body></html>
