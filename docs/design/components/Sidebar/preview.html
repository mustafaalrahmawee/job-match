<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:20px}*{box-sizing:border-box}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:36px;padding:0 16px;border-radius:var(--radius-md);font:inherit;font-weight:500;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}.btn-outline{background:var(--background);color:var(--foreground);border-color:var(--border)}.btn-ghost{background:transparent;color:var(--muted-foreground);padding:0 10px;height:32px}.btn-destructive{background:var(--destructive);color:var(--destructive-foreground)}.btn:disabled{opacity:.5}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:16px}
.input{height:36px;width:100%;border:1px solid var(--input);background:var(--background);color:var(--foreground);border-radius:var(--radius-md);padding:0 12px;font:inherit;box-shadow:var(--shadow-xs);outline:none}.input:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 50%,transparent)}
.pill{display:inline-flex;align-items:center;border-radius:var(--radius-full);padding:2px 8px;font-size:12px;line-height:16px;font-weight:500}
.muted{color:var(--muted-foreground)}.small{font-size:12px;line-height:16px}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></head><body style="padding:0;display:flex;height:420px">
<aside style="width:256px;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--border)">
<div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:var(--radius-md);background:var(--brand);color:var(--brand-foreground);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M2 13h20"/></svg></div><span style="font-size:15px;font-weight:600;letter-spacing:-.025em">job-match</span></div><span class="muted"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></span></div>
<nav style="display:flex;flex-direction:column;gap:2px;padding:4px 8px 12px;flex:1">
<a style="height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:var(--radius-md);color:var(--muted-foreground)"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M2 13h20"/></svg> Start</a>
<a style="height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:var(--radius-md);background:var(--accent);color:var(--foreground);font-weight:500"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg> Coach</a>
<a style="height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:var(--radius-md);color:var(--muted-foreground)"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg> Lebenslauf</a>
<p class="muted small" style="margin:12px 0 4px;padding:8px 12px 0;font-weight:500">Gespräche</p>
<a style="height:36px;display:flex;align-items:center;padding:0 12px;border-radius:var(--radius-md);background:var(--accent)">Gehalt verhandeln</a>
<a style="height:36px;display:flex;align-items:center;padding:0 12px;border-radius:var(--radius-md);color:var(--muted-foreground)">Anschreiben Mediahaus</a>
</nav>
<div style="display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--border)"><div style="width:32px;height:32px;border-radius:50%;background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">M</div><div style="flex:1;min-width:0"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">mia@example.de</div><div class="muted small">Bewerber:in</div></div></div>
</aside>
<main style="flex:1;display:flex;flex-direction:column"><header style="height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;font-weight:500">Gehalt verhandeln</header></main>
</body></html>
