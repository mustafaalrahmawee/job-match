name: job-match

services:
  db:
    image: postgres:17
    container_name: jobmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
      POSTGRES_DB: jobmatch
    ports:
      # Host-Port 5433, damit der Port nicht mit einer bereits laufenden
      # lokalen Postgres-Instanz kollidiert (Container-intern bleibt es 5432).
      - '5433:5432'
    volumes:
      - jobmatch-pgdata:/var/lib/postgresql/data
      # Legt beim ersten Start die Test-Datenbank `jobmatch_test` an.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobmatch -d jobmatch']
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: jobmatch-chroma
    restart: unless-stopped
    ports:
      - '127.0.0.1:8001:8000'
    volumes:
      - jobmatch-chromadata:/data

  chroma-test:
    image: chromadb/chroma:1.5.9
    container_name: jobmatch-chroma-test
    restart: unless-stopped
    ports:
      - '127.0.0.1:8002:8000'

  ollama:
    image: ollama/ollama:0.40.16
    container_name: jobmatch-ollama
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - jobmatch-ollamadata:/root/.ollama

  backend:
    image: node:24.21.0-bookworm-slim
    container_name: jobmatch-backend
    restart: unless-stopped
    user: '1000:1000'
    network_mode: host
    working_dir: /app
    command: node_modules/.bin/tsx watch src/server.ts
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_started

  frontend:
    image: node:24.21.0-bookworm-slim
    container_name: jobmatch-frontend
    restart: unless-stopped
    user: '1000:1000'
    network_mode: host
    working_dir: /app
    command: node_modules/.bin/vite
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  jobmatch-pgdata:
  jobmatch-chromadata:
  jobmatch-ollamadata:
