name: job-match

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: jobmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
      POSTGRES_DB: jobmatch
    ports:
      # Host-Port 5433, damit der Port nicht mit einer bereits laufenden
      # lokalen Postgres-Instanz kollidiert (Container-intern bleibt es 5432).
      - '5433:5432'
    volumes:
      - jobmatch-pgdata:/var/lib/postgresql/data
      # Legt beim ersten Start die Test-Datenbank `jobmatch_test` an.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobmatch -d jobmatch']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobmatch-pgdata:
